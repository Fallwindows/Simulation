<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery Aisle Simulation</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    header { padding: 12px 18px; border-bottom: 1px solid #374151; display: flex; justify-content: space-between; }
    main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr); gap: 12px; padding: 12px; }
    section { border: 1px solid #374151; border-radius: 8px; padding: 10px; background: #1f2937; }
    img { width: 100%; background: #000; min-height: 240px; object-fit: contain; }
    pre { white-space: pre-wrap; word-break: break-word; }
    .cloud { width: 100%; height: 320px; background: #030712; display: block; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><strong>Grocery Aisle Simulation</strong><span id="health">connecting…</span></header>
  <main>
    <section><h2>ROS RGB</h2><img src="/stream/rgb.mjpg" alt="ROS camera MJPEG stream"><pre id="status"></pre></section>
    <section><h2>LiDAR</h2><canvas id="lidar-cloud" class="cloud"></canvas><button id="reset-lidar">Reset LiDAR view</button></section>
    <section><h2>Accumulated map</h2><canvas id="map-cloud" class="cloud"></canvas><pre id="metrics"></pre><button id="reset-map">Reset map view</button></section>
  </main>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
  <script type="module" src="/app.js"></script>
</body>
</html>
